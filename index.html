<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7655">
<title>Avalanche — Debt Payoff Planner</title>
<style>
:root{
  --bg:#f3f4f0;--surface:#ffffff;--surface-2:#f1f2ee;--ink:#15201b;--ink-2:#4a5650;--ink-3:#85908a;--line:#e2e6df;
  --accent:#0e7655;--accent-ink:#ffffff;--accent-soft:#e1f1ea;
  --warn:#a35f00;--warn-soft:#fdf1da;--danger:#c23b2e;--danger-soft:#fce9e6;--info:#2b5ea6;--info-soft:#e7eef9;
  --c-flex:#2f7fd1;--c-big:#8657cc;--c-debt:#d6891a;--c-ef:#d0463a;
  --radius:18px;--shadow:0 1px 2px rgba(21,32,27,.04),0 6px 20px rgba(21,32,27,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1311;--surface:#161c19;--surface-2:#1e2522;--ink:#e8eeea;--ink-2:#a9b4ae;--ink-3:#77827c;--line:#29312d;
  --accent:#41c08f;--accent-ink:#04140d;--accent-soft:#15322a;
  --warn:#f0b04a;--warn-soft:#352810;--danger:#f07264;--danger-soft:#3a1916;--info:#86aaea;--info-soft:#18243a;
  --shadow:none;color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
.num,.big,.xl,.lg,.tile .v{font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.015em;font-size:17px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{border:0;background:transparent;color:var(--ink-2);padding:8px 12px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);outline:1px solid var(--line)}
nav.bottom{display:none}
main.wrap{padding:22px 16px 120px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.ph h1{font-size:26px;letter-spacing:-.02em;margin:0}
.ph .sub{color:var(--ink-3);font-size:14px;margin-top:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.g2e{grid-template-columns:1fr 1fr}
.mt{margin-top:10px}.mt8{margin-top:8px}.mt16{margin-top:16px}.center{text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 14px;font-size:16px;letter-spacing:-.01em}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.label{font-size:13px;color:var(--ink-2);font-weight:600}
.big{font-size:42px;font-weight:760;letter-spacing:-.03em;line-height:1.08;margin:6px 0 4px}
.xl{font-size:30px;font-weight:740;letter-spacing:-.025em;line-height:1.15;margin-top:2px}
.lg{font-size:21px;font-weight:720;letter-spacing:-.02em;line-height:1.2}
.lg small{font-size:14px;font-weight:600;color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:14px}
.hint{color:var(--ink-3);font-size:13px;line-height:1.4}
.muted{color:var(--ink-3)}
.goal{display:inline-block;margin-top:12px;padding:7px 12px;border-radius:10px;font-size:14px}
.goal.late{background:var(--warn-soft);color:var(--ink)} .goal.late b{color:var(--warn)}
.goal.ok{background:var(--accent-soft);color:var(--ink)} .goal.ok b{color:var(--accent)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.bar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kvs{margin-top:10px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;color:var(--ink-2);font-size:14px}
.kv b{color:var(--ink);font-weight:650;text-align:right}
.kv.neg b{color:var(--danger)}
.kv.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.down{color:var(--warn)}
.goesto{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:12px;font-size:14px;color:var(--ink-2)}
.goesto b{color:var(--ink)}
.done{display:flex;gap:12px;align-items:center;margin:14px 0 8px}
.ck{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:620;padding:9px 16px;border-radius:12px;cursor:pointer;min-height:42px;font-size:15px;transition:transform .06s,filter .15s,background .15s}
.btn:hover{filter:brightness(.97)} .btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.dangerfill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.lg{min-height:52px;padding:12px 22px;font-size:16px}
.btn:disabled{opacity:.55;cursor:default;transform:none;filter:none}
.btn.pay{width:100%;min-height:62px;margin-top:16px;font-size:17px;letter-spacing:.09em;text-transform:uppercase;font-weight:780;border:0;border-radius:15px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.pay:disabled{background:var(--surface-2);color:var(--ink-3);box-shadow:none;opacity:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);vertical-align:middle;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px;margin-bottom:12px;border:1px solid transparent}
.banner svg{flex:none;margin-top:1px}
.banner.bad{background:var(--danger-soft)} .banner.bad svg{color:var(--danger)}
.banner.warn{background:var(--warn-soft)} .banner.warn svg{color:var(--warn)}
.banner.info{background:var(--info-soft)} .banner.info svg{color:var(--info)}
.banner .grow{flex:1}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.tile .v{font-size:21px;font-weight:720;letter-spacing:-.02em;margin:4px 0 2px}
.tile.bad{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))} .tile.bad .v{color:var(--danger)}
.tgname{font-size:18px;font-weight:700;margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xrow{display:flex;justify-content:space-between;gap:12px;width:100%;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.xrow:first-of-type{border-top:0}
.xrow span{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.xrow .r{text-align:right;flex:none}
.late{color:var(--warn)!important}
.empty{padding:18px;text-align:center;color:var(--ink-3);font-size:14px;background:var(--surface-2);border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);margin:0 6px 6px 0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.flex{background:var(--c-flex)}.dot.big{background:var(--c-big)}.dot.debt{background:var(--c-debt)}.dot.ef{background:var(--c-ef)}
.xitem{padding:16px 0;border-top:1px solid var(--line)}
.xitem:first-child{border-top:0;padding-top:4px}
.xitem.cancelled{opacity:.6}
.xmain{display:flex;justify-content:space-between;gap:12px}
.xmain .r{text-align:right;flex:none}
.allocs{margin-top:10px}
.imp{font-size:14px;font-weight:620;margin-top:2px}
.xact{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.debt.target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.debt.paid{opacity:.72}
.dtop{display:flex;justify-content:space-between;gap:12px}
.dtop .r{text-align:right}
.dname{font-size:17px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.dgrid span{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
.dgrid b{display:block;font-weight:650;margin-top:2px}
.dgrid small{display:block;color:var(--ink-3);font-size:12px}
.dact{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.warnTxt{color:var(--warn);font-style:normal}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600;min-width:0}
.f input,.f select,.f textarea{font-size:16px;font-weight:450;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none;width:100%;min-height:44px}
.f textarea{resize:vertical;min-height:60px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f small{font-weight:450;color:var(--ink-3)}
.f.err input{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.span2{grid-column:1 / -1}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-2);font-weight:550;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.calc{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding:14px 16px;background:var(--accent-soft);border-radius:14px}
.calc span{font-weight:650}
.calc b{font-size:24px;font-weight:760;color:var(--accent);font-variant-numeric:tabular-nums}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type{position:relative;display:block;padding:11px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.type input{position:absolute;opacity:0;pointer-events:none}
.type b{display:block;color:var(--ink);font-size:14px}
.type small{display:block;color:var(--ink-3);font-weight:450;font-size:12.5px;line-height:1.35;margin-top:2px}
.type:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.preview{margin-top:18px;padding:16px;border-radius:16px;background:var(--surface-2)}
.preview .eyebrow{margin-bottom:8px}
.arow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:15px}
.arow span{flex:1}
.arow b{font-variant-numeric:tabular-nums}
.okline{color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
.note{font-size:13px;color:var(--ink-2);margin-top:6px;padding-left:18px;position:relative}
.note:before{content:"";position:absolute;left:4px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.ba .arrow{color:var(--ink-3)}
.ba .lbl{font-size:12px;color:var(--ink-3);font-weight:600}
.ba b{display:block;font-size:16px}
.impbig{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface)}
.impbig b{font-size:24px;font-weight:780}
.payline{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.payline .r{text-align:right;flex:none}
.payline .s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.payhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;background:var(--accent-soft);border-radius:14px;margin-bottom:8px}
.payhead b{font-size:28px;font-weight:780;color:var(--accent);font-variant-numeric:tabular-nums}
.cele{padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px;margin:8px 0}
details.pay{border-top:1px solid var(--line)}
details.pay summary{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:12px 0;cursor:pointer}
details.pay summary::-webkit-details-marker{display:none}
details.pay .in{padding:0 0 12px}
.loge{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.loge time{flex:none;width:92px;color:var(--ink-3);font-size:13px}
.grow{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-bottom:8px}
.grow input{font-size:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;color:var(--ink)}
.drow{padding:16px;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;background:var(--surface)}
.drow.off{opacity:.6}
.drow .dgr{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.drow .dgr2{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin-top:10px;align-items:end}
.setup{max-width:860px;margin:0 auto;padding:28px 16px 80px}
.setup h1{font-size:32px;letter-spacing:-.03em;margin:22px 0 6px}
.setup .lead{color:var(--ink-2);margin:0 0 22px;max-width:640px}
.setup .card{margin-bottom:16px}
.fab{display:none}
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.48);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;animation:fade .15s ease}
.sheet{background:var(--surface);border-radius:22px;width:100%;max-width:580px;max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:rise .18s ease}
.sheet.wide{max-width:680px}
.sheet .hd{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:2}
.sheet .hd h2{margin:0;font-size:19px;letter-spacing:-.015em}
.sheet .bd{padding:6px 20px 18px}
.sheet .ft{padding:12px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:2}
.sheet .ft .lft{margin-right:auto}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-12px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:80;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:.6}}
@media (max-width:820px){
  .tabs,.hide-m{display:none}
  .g2,.g2e{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .dgrid{grid-template-columns:1fr 1fr}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 0;cursor:pointer}
  nav.bottom button.on{color:var(--accent)}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;align-items:center;gap:6px;border:0;border-radius:99px;padding:13px 18px 13px 14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;box-shadow:0 10px 26px rgba(0,0,0,.25);cursor:pointer}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:22px 22px 0 0;max-height:94vh;max-width:none}
  .big{font-size:36px}
  .drow .dgr{grid-template-columns:1fr 1fr}
  .drow .dgr .nm{grid-column:1 / -1}
  .drow .dgr2{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){
  .split{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .types{grid-template-columns:1fr}
  .big{font-size:33px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
/* ============================================================
   Avalanche — personal debt payoff + irregular-expense planner
   Everything lives in localStorage under KEY. No network calls.
   ============================================================ */
const KEY = 'avalanche.v1';

/* ---------- small utilities ---------- */
const pad = n => String(n).padStart(2, '0');
const mk = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const parts = s => s.split('-').map(Number);
const lastDayOf = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const toT = s => { const [y, m, d] = parts(s); return Date.UTC(y, m - 1, d); };
const fromT = t => { const x = new Date(t); return mk(x.getUTCFullYear(), x.getUTCMonth() + 1, x.getUTCDate()); };
const diffDays = (a, b) => Math.round((toT(b) - toT(a)) / 864e5);
const addDays = (s, n) => fromT(toT(s) + n * 864e5);
const todayISO = () => { const n = new Date(); return mk(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const num = v => { if (v == null || v === '') return 0; const n = parseFloat(String(v).replace(/[$,%\s]/g, '')); return isFinite(n) ? n : 0; };
const numOrNull = v => { if (v == null || String(v).trim() === '') return null; const n = parseFloat(String(v).replace(/[$,%\s]/g, '')); return isFinite(n) ? n : null; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const USD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const USD0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const money = n => USD.format(Math.abs(n) < 0.005 ? 0 : n);
const money0 = n => USD0.format(Math.abs(n) < 0.5 ? 0 : n);

  state.payments.unshift({ id: uid(), period: c.cur.payday, periodEnd: c.cur.end, date: st.date, extraBase: r2(st.extraBase), take: r2(st.take),
    rebuild: r2(st.rebuild), available: r2(st.available), bucketAdded: addBucket ? bp : 0, total, lines, absorbed, paidOff, snap });
  log(`Paid the ${fmtD(c.cur.payday)} paycheck: ${money(total)} to debts (${money(st.available)} extra attack).${paidOff.length ? ' Paid off: ' + paidOff.join(', ') + '.' : ''}`);
  save(); closeModal(); render();
  toast(paidOff.length ? `🎉 ${paidOff.join(' & ')} paid off!` : 'Paycheck logged.');
}
function undoPayment() {
  const p = state.payments[0]; if (!p || !p.snap) return;
  state.debts = p.snap.debts; state.accounts = p.snap.accounts;
  for (const e of state.expenses) if (p.snap.covered[e.id] != null) e.debtCovered = p.snap.covered[e.id];
  state.payments.shift();
  log(`Undid the ${fmtD(p.period)} paycheck payment.`);
  save(); closeModal(); render(); toast('Payment undone.');
}

    <p class="hint" style="margin:-6px 0 14px">${state.lastExport ? `Last backup ${fmtD(state.lastExport)} (${ago(state.lastExport)}).` : 'No backup yet.'} Export a JSON file now and then — clearing browser data erases the app's memory.</p>
    ${backupAge == null || backupAge > 30 ? `<div class="banner warn">${ICON.alert}<div>${backupAge == null ? 'You haven\'t exported a backup yet.' : 'Your last backup is over a month old.'}</div></div>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="export">Export JSON</button><button class="btn" data-act="import">Import JSON</button><button class="btn ghost danger" data-act="reset">Reset everything</button></div>
  </section>
  <section class="card mt16"><h3>Paycheck payments</h3>
    ${P.length ? P.map((p, i) => `<details class="pay" ${i === 0 ? 'open' : ''}><summary><div><b>${fmtD(p.period)} paycheck</b><div class="hint">logged ${fmtD(p.date)}${p.paidOff && p.paidOff.length ? ` · 🎉 ${esc(p.paidOff.join(', '))} paid off` : ''}</div></div><div style="text-align:right"><b>${money(p.total)}</b><div class="hint">${money(p.available)} extra</div></div></summary>
      <div class="in">${p.lines.map(l => `<div class="kv"><span>${esc(l.name)}${l.extra > 0 ? ` <span class="pill ok">+${money(l.extra)} extra</span>` : ''}</span><b>${money(l.min + l.extra)} → ${money(l.after)}</b></div>`).join('')}
        ${p.take > 0 ? `<div class="kv neg"><span>Unusual expenses absorbed</span><b>−${money(p.take)}</b></div>` : ''}
        ${p.rebuild > 0 ? `<div class="kv"><span>Emergency rebuild to Ally Savings</span><b>${money(p.rebuild)}</b></div>` : ''}
        ${p.bucketAdded > 0 ? `<div class="kv"><span>Added to Big Purchase bucket</span><b>${money(p.bucketAdded)}</b></div>` : ''}
        ${i === 0 && p.snap ? `<button class="btn sm ghost danger mt8" data-act="undo-payment">Undo this payment</button>` : ''}</div></details>`).join('') : '<div class="empty">No paychecks logged yet. Use “Paid this paycheck” on the dashboard.</div>'}
  </section>
  <section class="card mt16"><h3>Expense history</h3>
    ${X.length ? X.map(e => `<div class="kv" style="border-top:1px solid var(--line);padding:10px 0"><span><b style="color:var(--ink)">${esc(e.desc)}</b><br><span class="hint">${fmtD(e.date)} · ${TYPE[e.type]} · ${e.status}</span></span><b>${money(num(e.amount))}${e.impact && e.impact.days ? `<br><span class="hint">${fmtDelta(e.impact.days)}</span>` : ''}</b></div>`).join('') : '<div class="empty">Paid and cancelled expenses show up here.</div>'}
  </section>
  <section class="card mt16"><h3>Activity</h3>
    ${state.log.slice(0, 150).map(l => `<div class="loge"><time>${fmtD(l.d)}</time><span>${esc(l.msg)}</span></div>`).join('') || '<div class="empty">Nothing yet.</div>'}
  </section>`;
}
function exportData() {
  state.lastExport = todayISO(); save();
  const data = JSON.stringify({ ...state, exportedAt: new Date().toISOString(), app: 'avalanche' }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = `avalanche-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  log('Exported a JSON backup.'); save(); render(); toast('Backup downloaded.');
}
function importData(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let obj; try { obj = JSON.parse(rd.result); } catch (e) { toast('That file isn\'t valid JSON.'); return; }
    if (!obj || !obj.settings || !Array.isArray(obj.debts)) { toast('That doesn\'t look like an Avalanche backup.'); return; }
    openModal({ title: 'Import backup?', body: `<p>Replace everything in this browser with the backup${obj.exportedAt ? ` from <b>${fmtD(obj.exportedAt.slice(0, 10))}</b>` : ''}? It holds ${plural(obj.debts.length, 'debt')}, ${plural((obj.expenses || []).length, 'expense')} and ${plural((obj.payments || []).length, 'payment')}.</p>`,
      foot: `<button class="btn" data-act="close">Cancel</button><button class="btn primary" id="doImport">Replace with backup</button>`,
      onMount: s => { s.querySelector('#doImport').onclick = () => { delete obj.exportedAt; delete obj.app; state = migrate(obj); log('Imported a JSON backup.'); save(); closeModal(); render(); toast('Backup imported.'); }; } });
  };
  rd.readAsText(file);
}

/* ---------- First-run setup ---------- */
function viewSetup() {
  const A = state.accounts, S = S_();
  return `<div class="setup">
    <div class="brand"><span class="mark">${ICON.logo}</span>Avalanche</div>
    <h1>Let's anchor to reality.</h1>
    <p class="lead">Pull current numbers from your bank and lender apps. Everything stays in this browser. Uncheck <b>Active</b> on anything you don't have handy — you can fill it in later.</p>
    <section class="card"><h3>Cash accounts</h3><form id="sAcc" class="fgrid" onsubmit="return false">
      ${moneyField('Chase Checking', 'chase', A.chase)}
      ${moneyField('Ally Spending — total', 'allySpending', A.allySpending, 'Including the bucket')}
      ${moneyField('Big Purchase bucket', 'bucket', A.bucket)}
      ${moneyField('Ally Savings (emergency)', 'allySavings', A.allySavings, `Floor ${money(S.efFloor)}`)}
    </form></section>
    <section class="card"><h3>Debts</h3>
      <p class="hint" style="margin:-6px 0 14px">Balance and APR are required for active debts. Student-loan minimums are paid from the fixed reserve; card minimums come out of the extra attack.</p>
      <div id="sDebts">${state.debts.map(setupRow).join('')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="setup-add" data-kind="federal">${ICON.plus} Federal loan group</button><button class="btn" data-act="setup-add" data-kind="other">${ICON.plus} Other debt</button></div>
    </section>
    <section class="card"><h3>Steady-state budget</h3>
      <div class="kv"><span>Net paycheck (15th & last day)</span><b>${money(S.paycheck)}</b></div>
      <div class="kv"><span>Fixed reserve · Flexible · Big Purchase</span><b>${money(S.fixed)} · ${money(S.flexible)} · ${money(S.bigPurchase)}</b></div>
      <div class="kv tot"><span>Extra debt attack per paycheck</span><b style="color:var(--accent)">${money(extraBase())}</b></div>
      <p class="hint">Editable later on the Accounts tab.</p>
    </section>
    <button class="btn primary lg" style="width:100%" data-act="setup-finish">Finish setup</button>
  </div>`;
}
function setupRow(d) {
  const ph = d.ph || {};
  return `<div class="drow ${d.active ? '' : 'off'}" data-id="${d.id}">
    <div class="dgr">
      <label class="f nm"><span>Name</span><input data-k="name" value="${esc(d.name)}"></label>
      <label class="f"><span>Balance</span><input data-k="bal" inputmode="decimal" value="${d.anchorBal == null ? '' : d.anchorBal}" placeholder="${esc(ph.bal || '0.00')}"></label>
      <label class="f"><span>APR %</span><input data-k="apr" inputmode="decimal" value="${d.apr == null ? '' : d.apr}" placeholder="${esc(ph.apr || '')}"></label>
      <label class="f"><span>Min / month</span><input data-k="min" inputmode="decimal" value="${d.min == null ? '' : d.min}" placeholder="${esc(ph.min || '0.00')}"></label>
    </div>
    <div class="dgr2">
      <label class="f"><span>Verified on</span><input data-k="date" type="date" value="${isISO(d.anchorDate) ? d.anchorDate : todayISO()}"></label>
      <label class="f"><span>Minimum from</span><select data-k="minFrom"><option value="fixed" ${d.minFrom === 'fixed' ? 'selected' : ''}>Fixed reserve</option><option value="extra" ${d.minFrom !== 'fixed' ? 'selected' : ''}>Extra attack</option></select></label>
      <label class="f"><span>Paid with</span><select data-k="due"><option value="15" ${d.due === '15' ? 'selected' : ''}>15th check</option><option value="eom" ${d.due === 'eom' ? 'selected' : ''}>End-of-month</option></select></label>
      <div style="display:flex;gap:10px;align-items:center;min-height:44px"><label class="chk"><input type="checkbox" data-k="active" ${d.active ? 'checked' : ''}> Active</label><button class="btn sm ghost" data-act="setup-remove" data-id="${d.id}" aria-label="Remove">${ICON.x}</button></div>
    </div></div>`;
}
function harvestSetup() {
  const fa = document.getElementById('sAcc');
  if (fa) { const fd = new FormData(fa); for (const k of ['chase', 'allySpending', 'bucket', 'allySavings']) state.accounts[k] = numOrNull(fd.get(k)); }
  document.querySelectorAll('.drow').forEach(row => {
    const d = state.debts.find(x => x.id === row.dataset.id); if (!d) return;
    const g = k => row.querySelector(`[data-k="${k}"]`);
    d.name = g('name').value.trim(); d.anchorBal = numOrNull(g('bal').value); d.apr = numOrNull(g('apr').value); d.min = numOrNull(g('min').value);
    d.anchorDate = isISO(g('date').value) ? g('date').value : todayISO(); d.minFrom = g('minFrom').value; d.due = g('due').value; d.active = g('active').checked;
  });
}
function finishSetup() {
  harvestSetup(); let bad = 0;
  document.querySelectorAll('.drow').forEach(row => {
    const d = state.debts.find(x => x.id === row.dataset.id);
    row.querySelectorAll('.f').forEach(f => f.classList.remove('err'));
    if (!d || !d.active) return;
    if (d.anchorBal == null) { row.querySelector('[data-k=bal]').closest('.f').classList.add('err'); bad++; }
    if (d.apr == null) { row.querySelector('[data-k=apr]').closest('.f').classList.add('err'); bad++; }
    if (!d.name) { row.querySelector('[data-k=name]').closest('.f').classList.add('err'); bad++; }
  });
  if (bad) { toast('Fill balance and APR for active debts, or uncheck Active.'); document.querySelector('.f.err input')?.focus(); return; }
  state.debts = state.debts.filter(d => d.name || d.anchorBal != null);
  for (const d of state.debts) {
    if (d.min == null) d.min = 0;
    if (d.anchorBal != null) { d.verifiedBal = d.anchorBal; d.verifiedDate = d.anchorDate; if (d.anchorBal <= 0.005) d.paidOffDate = d.anchorDate; }
    else d.active = false;
    delete d.ph;
  }
  for (const k of ['chase', 'allySpending', 'bucket', 'allySavings']) if (state.accounts[k] == null) state.accounts[k] = 0;
  state.accounts.asOf = todayISO(); state.setupDone = true; state.startTotal = r2(totalDebt());
  log(`Setup complete: ${money(state.startTotal)} total debt across ${plural(activeDebts().filter(d => estBal(d) > 0).length, 'active balance')}.`);
  save(); location.hash = 'dashboard'; render(); toast('You\'re set. Here\'s the plan.');
}

/* ============================================================
   Wiring
   ============================================================ */
const VIEWS = { dashboard: viewDashboard, expenses: viewExpenses, debts: viewDebts, accounts: viewAccounts, history: viewHistory };
function render() {
  MODEL = null;
  const app = document.getElementById('app');
  if (!state.setupDone) { app.innerHTML = viewSetup(); return; }
  app.innerHTML = shell(VIEWS[view()]());
}
const ACT = {
  close: () => closeModal(),
  nav: el => { if (location.hash.slice(1) === el.dataset.v) render(); else location.hash = el.dataset.v; window.scrollTo(0, 0); },
  'add-expense': () => openExpense(null),
  'edit-expense': el => { closeModal(); openExpense(el.dataset.id); },
  'save-expense': el => saveExpense(el.dataset.id || null),
  'pay-expense': el => openMarkPaid(el.dataset.id),
  'confirm-paid': el => {
    const e = state.expenses.find(x => x.id === el.dataset.id); if (!e) return;
    const cb = document.getElementById('mpDeduct');
    applyPaid(e, cb ? cb.checked : false); log(`Marked "${e.desc}" paid (${money(num(e.amount))}).`);
    save(); closeModal(); render(); toast('Marked paid.');
  },
  'cancel-expense': el => {
    const e = state.expenses.find(x => x.id === el.dataset.id); if (!e) return;
    if (e.status === 'paid') revertPaid(e);
    e.status = 'cancelled'; log(`Cancelled "${e.desc}".`); save(); render(); toast('Cancelled — the plan no longer counts it.');
  },
  'restore-expense': el => { const e = state.expenses.find(x => x.id === el.dataset.id); if (!e) return; e.status = 'planned'; log(`Restored "${e.desc}" to planned.`); save(); render(); },
  'delete-expense': el => {
    const e = state.expenses.find(x => x.id === el.dataset.id); if (!e) return;
    openModal({ title: 'Delete expense?', body: `<p>Delete <b>${esc(e.desc)}</b> (${money(num(e.amount))}) permanently?${e.deducted ? ' Its account deductions will be reversed.' : ''}</p>`,
      foot: `<button class="btn" data-act="close">Keep it</button><button class="btn dangerfill" data-act="delete-expense-yes" data-id="${e.id}">Delete</button>` });
  },
  'delete-expense-yes': el => {
    const e = state.expenses.find(x => x.id === el.dataset.id); if (!e) return;
    if (e.status === 'paid') revertPaid(e);
    state.expenses = state.expenses.filter(x => x.id !== e.id); log(`Deleted expense "${e.desc}".`); save(); closeModal(); render(); toast('Deleted.');
  },
  'exp-filter': el => { expFilter = el.dataset.v; render(); },
  'pay-preview': () => openPayPreview(),
  'pay-confirm': () => { const cb = document.getElementById('ppBucket'); processPaycheck(cb ? cb.checked : false); },
  'undo-payment': () => {
    const p = state.payments[0]; if (!p) return;
    openModal({ title: 'Undo payment?', body: `<p>Undo the <b>${fmtD(p.period)}</b> paycheck (${money(p.total)})? Debt balances, account balances and expense absorption go back to exactly how they were before it — including any balance updates you made since.</p>`,
      foot: `<button class="btn" data-act="close">Keep it</button><button class="btn dangerfill" data-act="undo-yes">Undo payment</button>` });
  },
  'undo-yes': () => undoPayment(),
  'edit-debt': el => openDebt(el.dataset.id),
  'add-debt': el => openDebt(null, el.dataset.kind),
  'save-debt': el => saveDebt(el.dataset.id || null),
  'delete-debt': el => {
    const d = state.debts.find(x => x.id === el.dataset.id); if (!d) return;
    openModal({ title: 'Delete debt?', body: `<p>Remove <b>${esc(d.name)}</b> entirely? To keep its history in the projection but stop tracking it, set it inactive instead.</p>`,
      foot: `<button class="btn" data-act="close">Cancel</button><button class="btn dangerfill" data-act="delete-debt-yes" data-id="${d.id}">Delete</button>` });
  },
  'delete-debt-yes': el => { const d = state.debts.find(x => x.id === el.dataset.id); state.debts = state.debts.filter(x => x.id !== el.dataset.id); log(`Deleted debt ${d ? d.name : ''}.`); save(); closeModal(); render(); toast('Debt removed.'); },
  'toggle-active': el => { const d = state.debts.find(x => x.id === el.dataset.id); if (!d) return; d.active = !d.active; log(`${d.name} set ${d.active ? 'active' : 'inactive'}.`); save(); render(); },
  'save-accounts': () => {
    const fd = new FormData(document.getElementById('accForm')), A = state.accounts, old = { ...A };
    for (const k of ['chase', 'allySpending', 'bucket', 'allySavings']) A[k] = r2(num(fd.get(k)));
    A.asOf = isISO(fd.get('asOf')) ? fd.get('asOf') : todayISO();
    if (A.bucket > A.allySpending + 0.005) toast('Heads up: the bucket is larger than the Ally Spending total.');
    const ch = ['chase', 'allySpending', 'bucket', 'allySavings'].filter(k => Math.abs(num(old[k]) - A[k]) > 0.004);
    log(`Updated account balances${ch.length ? ': ' + ch.map(k => `${{ chase: 'Chase', allySpending: 'Ally Spending', bucket: 'Bucket', allySavings: 'Ally Savings' }[k]} ${money(A[k])}`).join(', ') : ''}.`);
    save(); render(); toast('Balances saved.');
  },
  'save-budget': () => {
    const fd = new FormData(document.getElementById('budForm')), S = S_();
    for (const k of ['paycheck', 'fixed', 'flexible', 'bigPurchase']) S[k] = r2(num(fd.get(k)));
    if (extraBase() < 0) toast('Warning: those allocations exceed the paycheck.');
    log(`Budget updated: ${money(S.paycheck)} paycheck → ${money(S.fixed)} fixed, ${money(S.flexible)} flexible, ${money(S.bigPurchase)} big purchase, ${money(extraBase())} extra attack.`);
    save(); render(); toast('Budget saved.');
  },
  'save-rules': () => {
    const fd = new FormData(document.getElementById('ruleForm')), S = S_();
    S.efFloor = r2(num(fd.get('efFloor'))); if (isISO(fd.get('goal'))) S.goal = fd.get('goal');
    S.rebuildCap = numOrNull(fd.get('rebuildCap')); S.rollMins = fd.get('rollMins') === 'on';
    log(`Rules updated: floor ${money(S.efFloor)}, goal ${fmtD(S.goal)}.`); save(); render(); toast('Rules saved.');
  },
  'guide-add': () => { S_().flexGuide = readGuide(); S_().flexGuide.push({ label: 'New line', amt: 0 }); render(); },
  'guide-del': el => { const g = readGuide(); g.splice(+el.dataset.i, 1); S_().flexGuide = g; render(); },
  'save-guide': () => { S_().flexGuide = readGuide(); save(); render(); toast('Guide saved.'); },
  export: () => exportData(),
  import: () => { const f = document.getElementById('importFile'); f.value = ''; f.click(); },
  reset: () => openModal({ title: 'Reset everything?', body: `<p>This erases all debts, expenses, payments and settings in this browser. Export a backup first if you might want it back.</p><label class="f"><span>Type RESET to confirm</span><input id="resetTxt" autocomplete="off"></label>`,
    foot: `<button class="btn" data-act="close">Cancel</button><button class="btn dangerfill" data-act="reset-yes">Erase all data</button>` }),
  'reset-yes': () => {
    if ((document.getElementById('resetTxt').value || '').trim().toUpperCase() !== 'RESET') { toast('Type RESET to confirm.'); return; }
    try { localStorage.removeItem(KEY); } catch (e) {}
    state = defaultState(); save(); closeModal(); location.hash = ''; render(); toast('All data erased.');
  },
  'setup-add': el => { harvestSetup(); const k = el.dataset.kind, n = state.debts.filter(d => d.kind === 'federal').length;
    state.debts.push(newDebt(k === 'federal' ? { name: `Federal Group ${n + 1}`, kind: 'federal', minFrom: 'fixed' } : { name: '', kind: 'other', minFrom: 'extra' })); save(); render(); },
  'setup-remove': el => { harvestSetup(); state.debts = state.debts.filter(d => d.id !== el.dataset.id); save(); render(); },
  'setup-finish': () => finishSetup()
};
function onClick(e) {
  if (e.target.matches && e.target.matches('[data-scrim]')) { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
}
function onInput(e) {
  const t = e.target;
  if (t.closest('#budForm')) {
    const fd = new FormData(document.getElementById('budForm'));
    const ex = num(fd.get('paycheck')) - num(fd.get('fixed')) - num(fd.get('flexible')) - num(fd.get('bigPurchase'));
    document.getElementById('exCalc').textContent = money(ex);
  } else if (t.closest('#accForm')) {
    const fd = new FormData(document.getElementById('accForm'));
    document.getElementById('accDerived').innerHTML = `Flexible portion of Ally Spending: <b>${money(num(fd.get('allySpending')) - num(fd.get('bucket')))}</b>`;
  } else if (t.closest('#guideForm')) {
    document.getElementById('gBuf').textContent = money(num(S_().flexible) - readGuide().reduce((s, g) => s + g.amt, 0));
  } else if (t.closest('.drow') && t.dataset.k === 'active') {
    t.closest('.drow').classList.toggle('off', !t.checked);
  }
}
function boot() {
  load(); render();
  window.addEventListener('hashchange', () => { closeModal(); render(); });
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onInput);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  document.getElementById('importFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importData(f); });
  let seen = todayISO();
  const tick = () => { if (todayISO() !== seen) { seen = todayISO(); if (!document.querySelector('.scrim')) render(); } };
  setInterval(tick, 60000); document.addEventListener('visibilitychange', tick);
}
if (typeof document !== 'undefined' && document.getElementById('app')) boot();
</script>
